# Builds the Android app's debug APK and runs its JVM unit tests on every change to it.
# Download the APK from the run's "Artifacts" section.
name: Android debug APK

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", "data/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "data/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME) with its licences accepted
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: infinite-rts-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
